name: Actualizar Ventas Mes

on:
  workflow_dispatch:   # disparado externamente por cron-job.org cada 25 min

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Cachear Chromium de Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-v1

      - name: Instalar Playwright + Chromium
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - name: Descargar archivos de ventas desde SharePoint
        run: |
          python3 - << 'PYEOF'
          import sys, json, re, requests
          from datetime import datetime, timezone
          from playwright.sync_api import sync_playwright

          ARCHIVOS = [
              (
                  "https://elotgroup2020-my.sharepoint.com/:u:/g/personal/doriant_elotgroup_com/IQAs2o56QU-NQqo8-z-nzAS5AaqMALXi2vfNSXWZ7Rwafp0?e=24QJ8Y",
                  "data/ventas_mes.json",
                  "ventas_mes"
              ),
              (
                  "https://elotgroup2020-my.sharepoint.com/:u:/g/personal/doriant_elotgroup_com/IQDrWHQfvqvsSad5J525bYpMAYok4YkS46s_1qx3LuivWWc?e=L9TQZO",
                  "data/ventas_raspes.json",
                  "ventas_raspes"
              ),
              (
                  "https://elotgroup2020-my.sharepoint.com/:u:/g/personal/doriant_elotgroup_com/IQCpFbui95x1S5JXjev_tlsPATMjiDRm0DtiFAF9rfvVMh0?e=j1tIww",
                  "data/ventas_loteria.json",
                  "ventas_loteria"
              ),
          ]

          SP_BASE = "https://elotgroup2020-my.sharepoint.com"

          def token_from_url(url):
              m = re.search(r'/personal/[^/]+/([A-Za-z0-9_\-]+)\?', url)
              return m.group(1) if m else None

          def es_valido(data):
              return isinstance(data.get("body"), list) or isinstance(data.get("ventas"), list)

          def descargar(context, url, dest, label):
              content = None

              # ── Intento 1: requests directo via /_layouts/15/download.aspx ──
              token = token_from_url(url)
              if token:
                  dl_url = f"{SP_BASE}/_layouts/15/download.aspx?share={token}"
                  try:
                      print(f"[{label}] Intento 1: requests directo...")
                      r = requests.get(dl_url, headers={"User-Agent": "Mozilla/5.0"}, timeout=60, allow_redirects=True)
                      print(f"  -> status={r.status_code}, size={len(r.content)}")
                      t = r.text.strip()
                      if r.status_code == 200 and t.startswith("{"):
                          parsed = json.loads(t)
                          if es_valido(parsed):
                              content = r.text
                              print(f"  -> OK")
                  except Exception as e:
                      print(f"  -> error: {e}")

              # ── Intento 2: Playwright expect_download ─────────────────────
              if not content:
                  try:
                      print(f"[{label}] Intento 2: expect_download...")
                      page = context.new_page()
                      with page.expect_download(timeout=45000) as dl_info:
                          try:
                              page.goto(url + "&download=1", wait_until="commit", timeout=30000)
                          except Exception:
                              pass  # "Download is starting" — la descarga inicio, esperamos dl_info
                      path = dl_info.value.path()
                      with open(path, encoding="utf-8") as f:
                          content = f.read()
                      print(f"  -> {len(content)} chars")
                  except Exception as e:
                      print(f"  -> fallo: {e}")

              # ── Intento 3: Playwright interceptar respuesta JSON ──────────
              if not content or not content.strip().lstrip('﻿').startswith(("{", "[")):
                  print(f"[{label}] Intento 3: interceptar respuestas...")
                  captured = []

                  def on_response(resp):
                      try:
                          text = resp.body().decode("utf-8", errors="replace")
                          stripped = text.strip()
                          if not stripped.startswith("{"):
                              return
                          parsed = json.loads(stripped)
                          if es_valido(parsed):
                              captured.append(text)
                              print(f"  -> JSON con body/ventas ({len(text)} chars)")
                      except Exception:
                          pass

                  page2 = context.new_page()
                  page2.on("response", on_response)
                  try:
                      page2.goto(url, wait_until="networkidle", timeout=45000)
                  except Exception as e:
                      print(f"  -> navegacion: {e}")
                  if captured:
                      content = captured[-1]
                  # Fallback: archivos pequeños se muestran como preview en OneDrive
                  # El innerText tiene el array JSON con numeros de linea y newlines intercalados
                  if not content:
                      try:
                          import re as _re
                          page2.wait_for_timeout(3000)
                          inner = page2.evaluate("() => document.body.innerText || ''")
                          start = inner.find('[{')
                          print(f"  [dom] inner={len(inner)} chars, start={start}, preview={inner[max(0,start-10):start+60]!r}")
                          if start >= 0:
                              end = inner.rfind(']', start)
                              if end > start:
                                  chunk = inner[start:end+1]
                                  chunk = _re.sub(r'\n\s*\d+\s*\n', '', chunk)
                                  chunk = chunk.replace('\n', '')
                                  arr = json.loads(chunk)
                                  if isinstance(arr, list) and len(arr) > 0:
                                      content = json.dumps({"ventas": arr})
                                      print(f"  -> JSON array desde DOM ({len(arr)} items)")
                      except Exception as e:
                          print(f"  -> DOM: {e}")

              # ── Validar y guardar ─────────────────────────────────────────
              stripped_c = content.strip().lstrip('﻿') if content else ''
              if not stripped_c or not stripped_c.startswith(("{", "[")):
                  print(f"ERROR [{label}]: no se obtuvo JSON valido")
                  return False
              try:
                  data = json.loads(stripped_c)
              except json.JSONDecodeError as e:
                  print(f"ERROR [{label}]: JSON invalido: {e}")
                  return False

              if isinstance(data, list):
                  data = {"ventas": data}

              registros = data.get("ventas") or data.get("body") or []
              existing_arr = []
              try:
                  import os as _os
                  if _os.path.exists(dest):
                      with open(dest, encoding="utf-8") as ef:
                          existing_d = json.load(ef)
                      existing_arr = existing_d.get("ventas") or existing_d.get("body") or []
              except Exception:
                  pass

              if len(registros) == 0:
                  if len(existing_arr) > 0:
                      print(f"PROTECCIÓN [{label}]: descarga devolvió 0 registros pero el archivo actual tiene {len(existing_arr)} — no se sobreescribe")
                      return True
                  print(f"ADVERTENCIA [{label}]: 0 registros (archivo también estaba vacío)")
              elif len(existing_arr) > 0:
                  # Detectar cambio de mes: si la fecha máxima de los nuevos datos
                  # es de un mes distinto al de los datos existentes, crear backup _prev
                  import shutil as _sh
                  try:
                      new_dates = [v.get("fecha","") for v in registros if v.get("fecha")]
                      old_dates = [v.get("fecha","") for v in existing_arr if v.get("fecha")]
                      new_month = max(new_dates)[:7] if new_dates else ""
                      old_month = max(old_dates)[:7] if old_dates else ""
                      if new_month and old_month and new_month != old_month:
                          prev_dest = dest.replace(".json", "_prev.json")
                          _sh.copy2(dest, prev_dest)
                          print(f"  -> Mes cambió {old_month}→{new_month}, backup guardado: {prev_dest}")
                  except Exception as _e:
                      print(f"  -> No se pudo crear backup de mes: {_e}")

              data["updated"] = datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M UTC")
              with open(dest, "w", encoding="utf-8") as f:
                  json.dump(data, f, ensure_ascii=False)
              print(f"OK [{label}]: {len(registros)} registros -> {dest}")
              return True

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              context = browser.new_context(accept_downloads=True)
              errores = [label for url, dest, label in ARCHIVOS
                         if not descargar(context, url, dest, label)]
              browser.close()

          if errores:
              print(f"ERRORES en: {errores}")
              sys.exit(1)
          PYEOF

      - name: Descargar LakiDey y Turbito desde SharePoint
        run: |
          python3 - << 'PYEOF'
          import sys, json, re, requests, shutil, os
          from datetime import datetime, timezone
          from playwright.sync_api import sync_playwright

          ARCHIVOS_TEXTO = [
              (
                  "https://elotgroup2020-my.sharepoint.com/:t:/g/personal/doriant_elotgroup_com/IQDIrRWLuF50T5wkwsv-agARAap7krEApen64ueC8sMix3c?e=XbKcBR",
                  "data/ventas_lakidey.json",
                  "ventas_lakidey"
              ),
              (
                  "https://elotgroup2020-my.sharepoint.com/:t:/g/personal/doriant_elotgroup_com/IQDfCquyrPYXTZyfgHaynqt0AfaeWoisHxBxc_y1-nVkjDs?e=uHmzNj",
                  "data/ventas_turbito.json",
                  "ventas_turbito"
              ),
          ]

          SP_BASE = "https://elotgroup2020-my.sharepoint.com"

          def token_from_url(url):
              m = re.search(r'/personal/[^/]+/([A-Za-z0-9_\-]+)\?', url)
              return m.group(1) if m else None

          def parse_content(content):
              try:
                  data = json.loads(content.strip())
              except json.JSONDecodeError:
                  return None
              if isinstance(data, list):
                  return {"ventas": data}
              if isinstance(data, dict):
                  if "ventas" in data or "body" in data:
                      return data
                  for v in data.values():
                      if isinstance(v, list):
                          return {"ventas": v}
              return None

          def descargar(context, url, dest, label):
              content = None
              token = token_from_url(url)
              if token:
                  dl_url = f"{SP_BASE}/_layouts/15/download.aspx?share={token}"
                  try:
                      print(f"[{label}] Intento 1: requests directo...")
                      r = requests.get(dl_url, headers={"User-Agent": "Mozilla/5.0"}, timeout=60, allow_redirects=True)
                      t = r.text.strip()
                      if r.status_code == 200 and (t.startswith('{') or t.startswith('[')):
                          content = t
                          print(f"  -> OK ({len(content)} chars)")
                  except Exception as e:
                      print(f"  -> error: {e}")
              if not content:
                  try:
                      print(f"[{label}] Intento 2: interceptar text/plain...")
                      captured = []
                      def on_response(resp):
                          ct = resp.headers.get('content-type', '')
                          cd = resp.headers.get('content-disposition', '')
                          if 'text/plain' in ct or 'attachment' in cd:
                              try:
                                  text = resp.body().decode('utf-8', errors='replace')
                                  s = text.strip()
                                  if s and '<html' not in s[:100].lower() and (s.startswith('{') or s.startswith('[')):
                                      captured.append(text)
                                      print(f"  -> capturado: {len(text)} chars")
                              except Exception as e2:
                                  print(f"  -> error resp: {e2}")
                      page = context.new_page()
                      page.on("response", on_response)
                      try:
                          page.goto(url, wait_until="networkidle", timeout=45000)
                      except Exception as e:
                          print(f"  -> navegacion: {e}")
                      if captured:
                          content = captured[-1]
                      else:
                          body_text = page.evaluate("() => document.body.innerText || ''")
                          s = body_text.strip()
                          if s and (s.startswith('{') or s.startswith('[')):
                              content = s
                              print(f"  -> DOM fallback: {len(content)} chars")
                  except Exception as e:
                      print(f"  -> Intento 2 fallo: {e}")
              if not content:
                  print(f"ERROR [{label}]: no se pudo descargar")
                  return False
              result = parse_content(content)
              if result is None:
                  print(f"ERROR [{label}]: JSON no reconocido")
                  return False
              registros = result.get("ventas") or result.get("body") or []
              existing_arr = []
              if os.path.exists(dest):
                  try:
                      with open(dest, encoding='utf-8') as ef:
                          ed = json.load(ef)
                      existing_arr = ed.get("ventas") or ed.get("body") or []
                  except Exception:
                      pass
              if len(registros) == 0 and len(existing_arr) > 0:
                  print(f"PROTECCIÓN [{label}]: 0 registros, archivo actual tiene {len(existing_arr)} — no se sobreescribe")
                  return True
              if existing_arr and registros:
                  try:
                      new_dates = [v.get("fecha","") for v in registros if v.get("fecha")]
                      old_dates = [v.get("fecha","") for v in existing_arr if v.get("fecha")]
                      new_month = max(new_dates)[:7] if new_dates else ""
                      old_month = max(old_dates)[:7] if old_dates else ""
                      if new_month and old_month and new_month != old_month:
                          prev_dest = dest.replace(".json", "_prev.json")
                          shutil.copy2(dest, prev_dest)
                          print(f"  -> Mes cambió {old_month}→{new_month}, backup: {prev_dest}")
                  except Exception as e:
                      print(f"  -> No se pudo crear backup: {e}")
              result["updated"] = datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M UTC")
              with open(dest, "w", encoding="utf-8") as f:
                  json.dump(result, f, ensure_ascii=False)
              print(f"OK [{label}]: {len(registros)} registros -> {dest}")
              return True

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              context = browser.new_context(accept_downloads=True)
              errores = [label for url, dest, label in ARCHIVOS_TEXTO
                         if not descargar(context, url, dest, label)]
              browser.close()

          if errores:
              print(f"ERRORES en: {errores}")
              sys.exit(1)
          PYEOF

      - name: Snapshot fin de mes (si aplica)
        run: |
          python3 - << 'PYEOF'
          import json, sys
          from datetime import date, datetime, timedelta, timezone
          from pathlib import Path

          # Usar hora Peru (UTC-5) para que el cron de las 11pm funcione correctamente.
          # A las 11pm Peru = 4am UTC del dia siguiente; date.today() devuelve el dia UTC
          # (ya es el 1 del mes), pero en Peru todavia es el ultimo dia del mes anterior.
          PERU_TZ = timezone(timedelta(hours=-5))
          today    = datetime.now(PERU_TZ).date()
          tomorrow = today + timedelta(days=1)

          # Solo actuar si mañana es el 1 del mes siguiente
          if tomorrow.month == today.month:
              print(f"No es fin de mes ({today} hora Peru). Nada que hacer.")
              sys.exit(0)

          print(f"Fin de mes detectado: {today} (hora Peru)")

          # Jueves de la semana actual
          dias_desde_jueves = (today.weekday() - 3) % 7
          jueves             = today - timedelta(days=dias_desde_jueves)
          miercoles_teorico  = jueves + timedelta(days=6)

          # Si la semana cierra dentro del mismo mes el snapshot del jueves la cubrirá
          if miercoles_teorico.month == today.month:
              print(f"La semana {jueves}→{miercoles_teorico} queda en el mismo mes. El jueves la capturará.")
              sys.exit(0)

          # Semana incompleta: Jue en este mes, Mié en el siguiente
          miercoles_real = today   # último día del mes = corte efectivo
          dias_completos = (miercoles_real - jueves).days + 1
          print(f"Semana incompleta: {jueves} (Jue) → {miercoles_real} ({dias_completos}/7 días)")
          print(f"  Día faltante que pasa al modelo siguiente: {miercoles_teorico}")

          PREMIOS = {
              'A': {'tienda': 100, 'admi': 70},
              'B': {'tienda':  70, 'admi': 50},
              'C': {'tienda':  50, 'admi': 40},
              'D': {'tienda':  40, 'admi': 30},
          }

          ventas_data  = json.loads(Path('data/ventas_mes.json').read_text(encoding='utf-8'))
          loteria_data = json.loads(Path('data/ventas_loteria.json').read_text(encoding='utf-8'))
          puntos_data  = json.loads(Path('data/puntos.json').read_text(encoding='utf-8'))
          keys_data    = json.loads(Path('data/keys_bonos.json').read_text(encoding='utf-8'))

          keys   = {k['cluster']: k for k in keys_data}
          tambos = [p for p in puntos_data
                    if 'TAMBO' in str(p.get('tipo', '')).upper()
                    or str(p.get('cluster_bono', '')).strip().upper() in ['A','B','C','D']]

          # TOTAL desde ventas_mes.json
          ventas = ventas_data.get('body') or ventas_data.get('ventas') or []
          ventas_map = {}
          for v in ventas:
              try:
                  fecha = date.fromisoformat(v.get('fecha', '1900-01-01'))
              except ValueError:
                  continue
              if fecha < jueves or fecha > miercoles_real:
                  continue
              if v.get('tipo_juego') != 'TOTAL':
                  continue
              vid = str(v.get('org_code', ''))
              if vid not in ventas_map:
                  ventas_map[vid] = {'pp': 0, 'ld': 0, 'grand': 0}
              ventas_map[vid]['grand'] += v.get('total') or 0
          # PozoPower y LakiDey
          loteria_rows = loteria_data.get('ventas') or loteria_data.get('body') or []
          import os as _os2
          _lk_path = Path('data/ventas_lakidey.json')
          if _lk_path.exists():
              try:
                  _lk = json.loads(_lk_path.read_text(encoding='utf-8'))
                  _lk_rows = _lk.get('ventas') or _lk.get('body') or []
                  if _lk_rows:
                      loteria_rows = [v for v in loteria_rows if v.get('tipo_juego') != 'LakiDey']
                      loteria_rows.extend(_lk_rows)
              except Exception: pass
          for v in loteria_rows:
              try:
                  fecha = date.fromisoformat(v.get('fecha', '1900-01-01'))
              except ValueError:
                  continue
              if fecha < jueves or fecha > miercoles_real:
                  continue
              vid = str(v.get('org_code', ''))
              if vid not in ventas_map:
                  ventas_map[vid] = {'pp': 0, 'ld': 0, 'grand': 0}
              tj  = v.get('tipo_juego', '')
              amt = v.get('total') or 0
              if tj == 'PozoPower': ventas_map[vid]['pp'] += amt
              if tj == 'LakiDey':  ventas_map[vid]['ld'] += amt

          TIER_ORDER  = ['A', 'B', 'C', 'D']
          ganadores   = []
          por_cluster = {}
          for p in tambos:
              pid = str(p.get('ID', ''))
              cb  = str(p.get('cluster_bono', '')).strip().upper()
              if cb not in TIER_ORDER:
                  continue
              v      = ventas_map.get(pid, {'pp': 0, 'ld': 0, 'grand': 0})
              pp_uni = v['pp'] // 5
              total  = v['grand']
              floor_idx = TIER_ORDER.index(cb)
              bono_tier = None
              for ti in range(floor_idx + 1):
                  t = TIER_ORDER[ti]
                  k = keys.get(t)
                  if k and total >= k['meta'] and pp_uni >= k['pp'] and v['ld'] >= k['lakidey']:
                      bono_tier = t
                      break
              if bono_tier is None:
                  continue
              prem = PREMIOS.get(bono_tier, {'tienda': 0, 'admi': 0})
              ganadores.append({
                  'id':          pid,
                  'nombre':      p.get('nombre', ''),
                  'cluster':     cb,
                  'bono_tier':   bono_tier,
                  'rc':          p.get('rc', ''),
                  'supervisor':  p.get('supervisor', ''),
                  'total':       total,
                  'pp':          pp_uni,
                  'ld':          v['ld'],
                  'bono_tienda': prem['tienda'],
                  'bono_admi':   prem['admi'],
              })
              por_cluster[bono_tier] = por_cluster.get(bono_tier, 0) + 1

          primer_jueves = jueves.replace(day=1)
          while primer_jueves.weekday() != 3:
              primer_jueves += timedelta(days=1)
          bono_num = ((jueves - primer_jueves).days // 7) + 1
          bono_num = max(1, min(5, bono_num))

          # Guardar datos acumulados de TODAS las tambos (no solo ganadores)
          # para que el snapshot del mes siguiente pueda completar la semana
          ventas_parciales = {}
          for p in tambos:
              pid = str(p.get('ID', ''))
              cb  = str(p.get('cluster_bono', '')).strip().upper()
              if cb not in TIER_ORDER:
                  continue
              v = ventas_map.get(pid)
              if v and (v['pp'] > 0 or v['ld'] > 0 or v['grand'] > 0):
                  ventas_parciales[pid] = {
                      'pp':    v['pp'] // 5,   # soles → unidades
                      'ld':    v['ld'],
                      'grand': v['grand'],
                  }

          meses_es = ['','Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic']
          entry = {
              'jueves':           str(jueves),
              'miercoles':        str(miercoles_real),
              'semana':           f"{jueves.day} {meses_es[jueves.month]} – {miercoles_real.day} {meses_es[miercoles_real.month]} {miercoles_real.year}",
              'bono_num':         bono_num,
              'completa':         False,
              'dias_completos':   dias_completos,
              'nota':             f"Semana incompleta: falta {meses_es[miercoles_teorico.month]} {miercoles_teorico.day} (modelo nuevo)",
              'total_ganadores':  len(ganadores),
              'por_cluster':      por_cluster,
              'ganadores':        sorted(ganadores, key=lambda x: x['cluster'] + x['nombre']),
              'ventas_parciales': ventas_parciales,
          }

          print(f"  BONO {bono_num} | {dias_completos}/7 días | {len(ganadores)} ganadores")

          hist_path = Path('data/historico_bonos.json')
          hist = json.loads(hist_path.read_text(encoding='utf-8')) if hist_path.exists() else {'semanas': []}

          idx = next((i for i, s in enumerate(hist['semanas']) if s['jueves'] == str(jueves)), None)
          if idx is not None:
              hist['semanas'][idx] = entry
              print(f"  Entrada {jueves} reemplazada")
          else:
              hist['semanas'].append(entry)
              print(f"  Entrada {jueves} agregada")

          hist['semanas'].sort(key=lambda s: s['jueves'])
          hist_path.write_text(json.dumps(hist, ensure_ascii=False, indent=2), encoding='utf-8')
          print("historico_bonos.json guardado OK")
          PYEOF

      - name: Commit si hubo cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ventas_mes.json data/ventas_raspes.json data/ventas_loteria.json data/ventas_lakidey.json data/ventas_turbito.json data/historico_bonos.json
          git add data/ventas_mes_prev.json data/ventas_raspes_prev.json data/ventas_loteria_prev.json data/ventas_lakidey_prev.json data/ventas_turbito_prev.json 2>/dev/null || true
          git diff --cached --quiet || {
            git commit -m "chore: actualizar ventas_mes.json [skip ci]"
            for i in 1 2 3 4 5; do
              git pull --rebase && git push && break
              echo "Intento $i fallido, reintentando en $((i*5))s..."
              sleep $((i * 5))
            done
          }
